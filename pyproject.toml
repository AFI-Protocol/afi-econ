[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afi-econ-kit"
version = "0.1.0"
description = "AFI economic model reproducibility toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "AFI"}]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "click>=8.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4"
]

[project.scripts]
"afi-econ-kit" = "afi_econ_kit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["afi_econ_kit"]
