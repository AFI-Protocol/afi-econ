name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]
    
    - name: Run tests
      env:
        AFI_ECON_KIT_ENFORCE_GOLDEN: "1"
        MPLBACKEND: Agg
        TZ: UTC
        PYTHONHASHSEED: "0"
      run: |
        pytest -q --tb=short

    - name: Run golden image tests
      env:
        AFI_ECON_KIT_ENFORCE_GOLDEN: "1"
        AFI_ECON_GOLDEN_TEST: "1"
        MPLBACKEND: Agg
        TZ: UTC
        PYTHONHASHSEED: "0"
      run: |
        pytest tests/test_budget_golden.py tests/test_gauge_shares_golden.py -v
    
    - name: Test CLI commands
      run: |
        afi-econ-kit check --config config.yaml
        afi-econ-kit simulate --config config.yaml --outdir ci_test
        test -f ci_test/econ_summary.json
        rm -rf ci_test

  strict-container:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y git
    
    - name: Install exact dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install package
      run: |
        pip install -e .
    
    - name: Run tests in strict mode
      env:
        AFI_ECON_KIT_ENFORCE_GOLDEN: "1"
        MPLBACKEND: Agg
        TZ: UTC
        PYTHONHASHSEED: "0"
      run: |
        python -m pytest -q --tb=short

    - name: Run golden tests in container
      env:
        AFI_ECON_KIT_ENFORCE_GOLDEN: "1"
        AFI_ECON_GOLDEN_TEST: "1"
        MPLBACKEND: Agg
        TZ: UTC
        PYTHONHASHSEED: "0"
      run: |
        python -m pytest tests/test_budget_golden.py tests/test_gauge_shares_golden.py -v
    
    - name: Test simulation performance
      run: |
        time afi-econ-kit simulate --config config.yaml --outdir perf_test
        test -f perf_test/econ_summary.json
        # Check that simulation completes in reasonable time (handled by timeout)

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
    
    - name: Run flake8
      run: |
        flake8 src/afi_econ_kit tests --max-line-length=100 --ignore=E203,W503
    
    - name: Check black formatting
      run: |
        black --check --line-length=100 src/afi_econ_kit tests

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/afi-protocol/afi-econ-kit
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable={{is_default_branch}}

      - name: Extract tag
        id: extract_tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image (STRICT=0)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            STRICT=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image (STRICT=1)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}-strict
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            STRICT=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
